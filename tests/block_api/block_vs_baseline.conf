# Default configuration for run_block_vs_baseline.sh.
# Command-line arguments override these values.

# Workload set. Supported ops: put get del.
ops=put get del
size=2097152

# Default quick comparison: 20 GiB, 1 round, 1/4/8 threads.
total_gib=20
threads=1 4 8
rounds=1

# Full benchmark preset is intentionally disabled in the runner. Keep these
# values here only as a reference for manual, carefully cleaned experiments.
full_total_gib=100
full_threads=1 2 4 8
full_rounds=3

# Runtime endpoints and paths.
host=127.0.0.1
port=55510
capacity=107374182400
block_data_dir=/tmp/opencode/falcon-block-data
result_dir=/tmp/opencode/block-vs-baseline-results
posix_root=/tmp/compare_block_vs_baseline_posix

# Safety and validation.
cleanup=true
require_no_errors=true
min_free_gib_extra=20
block_verify=false
